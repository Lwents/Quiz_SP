name: Test and deploy Quiz_SP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-sp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          # Tests need a signing key but must never use the production key.
          SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" python -m pytest -q -k 'not trio'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Deploy backend to VPS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/quiz-sp-deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/quiz-sp-deploy ~/.ssh/known_hosts
          tar --exclude=.env --exclude='.env.*' --exclude=__pycache__ --exclude=.venv --exclude='*.pyc' \
            -czf - backend compose.production.yaml \
            | ssh -i ~/.ssh/quiz-sp-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 "root@$VPS_HOST" deploy-backend
      - name: Deploy frontend to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: frontend
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VITE_API_URL" || { echo 'Set repository variable VITE_API_URL.'; exit 1; }
          tar -czf - dist \
            | ssh -i ~/.ssh/quiz-sp-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 "root@$VPS_HOST" deploy-frontend
