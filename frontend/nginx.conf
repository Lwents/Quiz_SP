limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_redirect ${BACKEND_UPSTREAM}/ $scheme://$http_host/;
    include /etc/nginx/security-headers.inc;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/security-headers.inc;
    }

    location ~ ^/api/v1/auth/(login|register|refresh)$ {
        limit_req zone=auth burst=15 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass ${BACKEND_UPSTREAM}$request_uri;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM}$request_uri;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 64m;
    }

    location /media/ {
        proxy_pass ${BACKEND_UPSTREAM}$request_uri;
        proxy_set_header Host $proxy_host;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.inc;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
