<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    
    <linearGradient id="sparkGrad" x1="74" y1="74" x2="106" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="capGrad" x1="30" y1="30" x2="98" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)"/>
  <rect x="9" y="9" width="110" height="110" rx="27" stroke="#93C5FD" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Academic Cap Top -->
  <polygon points="64,28 102,46 64,64 26,46" fill="url(#capGrad)" filter="url(#dropShadow)"/>

  <!-- Cap Lower Arch -->
  <path d="M39 55.5 V69 C39 77 50 83 64 83 C78 83 89 77 89 69 V55.5 L64 67 Z" fill="#BFDBFE"/>

  <!-- Tassel -->
  <path d="M64 46 L95 62 V76" stroke="#FDE68A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="95" cy="78" r="3.5" fill="#F59E0B"/>

  <!-- Achievement Badge at bottom right -->
  <circle cx="92" cy="92" r="20" fill="#FFFFFF" filter="url(#dropShadow)"/>
  <circle cx="92" cy="92" r="16.5" fill="url(#sparkGrad)"/>
  <!-- Checkmark in badge -->
  <path d="M85 92.5 L89.5 97 L99 86.5" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
